name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build, test and audit
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android command-line tools
        # The official command-line tools are installed directly rather than
        # through a third-party action: fewer moving parts, and the exact
        # version is pinned instead of tracking someone else's release cadence.
        run: |
          set -euo pipefail
          ANDROID_TOOLS_VERSION="11076708"
          ANDROID_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-mac-${ANDROID_TOOLS_VERSION}_latest.zip"
          curl -fsSL -o /tmp/cmdline-tools.zip "$ANDROID_TOOLS_URL"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-extract
          rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          mv /tmp/cmdline-tools-extract/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Verify the Gradle wrapper
        run: |
          test -x ./gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          ./gradlew --version

      - name: Static safety audit (manifest + privacy policy)
        run: bash scripts/audit.sh

      - name: Secret audit (tree and full Git history)
        run: bash scripts/audit-secrets.sh

      - name: Test isolation audit (no destructive test on user data)
        # An instrumentation test that clears the database would DELETE THE
        # USER'S MESSAGES if the suite were ever run on a phone with the real
        # app installed. The destructive tests must go through
        # TestDataIsolation, which refuses to destroy data outside an isolated
        # package.
        run: python3 scripts/audit-test-isolation.py

      - name: DHC connector tests (python)
        run: python3 integrations/dhc/tests/test_connector.py

      - name: DHC cross-language fixtures (python -> android)
        # The fixtures are produced by the python reference implementation and
        # validated by the android side. This is the direction that finds
        # byte-level disagreements between the two.
        run: |
          mkdir -p app/build/outputs/dhc-fixtures
          python3 integrations/dhc/tests/python_fixture.py app/build/outputs/dhc-fixtures
          ls -la app/build/outputs/dhc-fixtures

      - name: DHC contract compatibility
        # The contract is the single source of truth. A change to it on one
        # side without the other is a breaking change.
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "integrations/dhc")
          from protocol import contract, crypto
          assert contract.SCHEMA_NAME == "PRIVATE_INBOX_EXPORT_V1"
          assert contract.SCHEMA_VERSION == 1
          assert crypto.DEFAULT_ITERATIONS == 210_000
          assert crypto.MIN_ITERATIONS == 50_000
          print("contract OK:", contract.SCHEMA_NAME, "v", contract.SCHEMA_VERSION)
          PY

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testProdDebugUnitTest

      - name: Android Lint
        run: ./gradlew --no-daemon :app:lintProdDebug

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleProdDebug

      - name: Assemble release APK (unsigned until a release key is configured)
        run: ./gradlew --no-daemon :app:assembleProdRelease
        continue-on-error: true

      - name: Audit the built artifacts
        run: bash scripts/audit-release.sh

      - name: Audit the built APK permissions
        run: |
          APK=app/build/outputs/apk/prod/debug/app-prod-debug.apk
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump permissions "$APK" | tee permissions.txt
          echo "--- forbidden permissions ---"
          if grep -E '(android\.permission\.(INTERNET|READ_SMS|READ_CONTACTS|QUERY_ALL_PACKAGES|READ_EXTERNAL_STORAGE|ACCESS_NETWORK_STATE))' permissions.txt; then
            echo '::error::Unexpected sensitive permission in the built APK'
            exit 1
          fi
          echo "OK: no sensitive permission present"

      - name: Verify the APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --print-certs app/build/outputs/apk/prod/debug/app-prod-debug.apk

      - name: Instrumentation on the ISOLATED devtest variant
        # The destructive tests (the ones that clear the database) run against
        # the devtest variant, whose application id has its own data directory.
        # They physically cannot reach the production app's database, which is
        # what makes running them on a device safe.
        run: ./gradlew --no-daemon :app:connectedDevtestDebugAndroidTest
        continue-on-error: true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PrivateInboxClassic-debug-apk
          path: app/build/outputs/apk/prod/debug/app-prod-debug.apk
          if-no-files-found: error
          retention-days: 14
